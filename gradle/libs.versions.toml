[versions]
agp = "9.2.1"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
camerax = "1.4.2"
playServicesLocation = "21.3.0"
arsceneview = "2.3.3"
arcore = "1.52.0"
mapsUtils = "4.0.0"
# 8.3.x requires compileSdk 37 (unreleased/preview); 8.2.0 is the newest that targets compileSdk 36,
# matching this project. Bump to 8.3.x only after moving compileSdk to 37.
mapsCompose = "8.2.0"
secretsPlugin = "2.0.1"
# Room 2.8.4 is the current stable 2.x (maintenance) line and still ships room-ktx. Room 3.0.x is
# alpha, coordinates androidx.room3, and drops room-ktx (coroutines-first) — not "current stable".
room = "2.8.4"
# KSP 2.3.10 is the first release that fixes R-class resolution under AGP 9 built-in Kotlin (KGP
# 2.2.10). AGP 9 requires KSP >= 2.3.6; KSP1 is incompatible with AGP 9. Versioned independently of
# Kotlin now (KSP2), so this is a plain 2.3.10, not the old <kotlin>-<ksp> form.
ksp = "2.3.10"
# UNIT TESTS ONLY. org.json ships in android.jar, but the mockable android.jar used by local unit
# tests stubs every method to throw "not mocked", so a JSON-parsing test can't run against it. This is
# the reference implementation of the same API, put on the test classpath ahead of the stub. Plain
# Java, so it carries no Kotlin metadata and can't hit the compiler's 2.3.0 metadata ceiling.
orgJson = "20250107"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons for the bottom NavigationBar. material-icons-CORE only (~40 icons, a few hundred KB) — NOT
# material-icons-extended, which is thousands of vectors. Version comes from the Compose BOM, which
# pins it at 1.7.8: the icons artifacts are frozen/deprecated upstream, but 1.7.8 was built with an
# older Kotlin, so its metadata is well below the 2.3.0 ceiling and it can't hit the Coil-style trap.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
arsceneview = { group = "io.github.sceneview", name = "arsceneview", version.ref = "arsceneview" }
ar-core = { group = "com.google.ar", name = "core", version.ref = "arcore" }
maps-utils = { group = "com.google.maps.android", name = "android-maps-utils", version.ref = "mapsUtils" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
secrets-gradle = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsPlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

