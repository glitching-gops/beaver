# Committed fallback for the Secrets Gradle Plugin.
# This lets the project configure and build on any machine even before a real Maps API key is added.
# It is NOT a working key — satellite map tiles render blank until you put a real key in
# local.properties as: MAPS_API_KEY=<your key>
MAPS_API_KEY=YOUR_KEY_HERE

# Pl@ntNet identification API key. Same rule: the real key goes in local.properties (git-ignored) as
#   PLANTNET_API_KEY=<your key>
# Get one free at https://my.plantnet.org/ → sign up → "API" tab → generate key (500 requests/day on
# the free tier). Until a real key is set, the Identify screen says so explicitly rather than failing
# with an opaque 401.
PLANTNET_API_KEY=YOUR_PLANTNET_KEY_HERE
